apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-demo-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-demo-app
  template:
    metadata:
      labels:
        app: devops-demo-app
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: devops-demo-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: devops-demo-app
  ports:
    - port: 80
      targetPort: 80
